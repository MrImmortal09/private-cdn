# /etc/nginx/sites-available/private-cdn — HTTPS for cdn.axiosiiitl.dev,
# forwarded to the private-cdn binary on loopback.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.axiosiiitl.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cdn.axiosiiitl.dev;

    ssl_certificate /etc/letsencrypt/live/private-cdn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/private-cdn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20G;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
